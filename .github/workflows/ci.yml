name: AGV checks
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    env:
      AGV_MOSQUITTO_BIN: /usr/sbin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: AGVwebserver/package-lock.json}
      - run: sudo apt-get update && sudo apt-get install -y g++ libmosquitto-dev libssl-dev mosquitto openssl
      - run: npm ci --prefix AGVwebserver
      - run: mkdir -p build && g++ -Iinclude -std=c++17 -pthread src/core/AGVserver.cpp -lmosquitto -lssl -lcrypto -o build/agv_core.exe && g++ -Iinclude -std=c++17 -pthread tests/core_tests.cpp -o build/core_tests && ./build/core_tests
      - run: node --test --test-isolation=none tests/gateway.test.js tests/security.test.js
      - run: node tests/system.integration.js && node tests/hardening.integration.js
      - run: python3 -m pip install 'jsonschema>=4,<5' && python3 scripts/check_workspace.py

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Isrc
lib_deps =  
    miguelbalboa/MFRC522 @ 1.4.12
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ 6.21.5
test_ignore = test_control

[env:esp32dev_trial]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DAGV_ONE_ROBOT_TRIAL=1

[env:esp32dev_robot2_monitor]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DAGV_ROBOT_2_MONITOR=1

[env:esp32dev_two_robot_bench_01]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DAGV_TWO_ROBOT_BENCH_TRIAL=1 -DAGV_ROBOT_PROFILE_01=1
upload_speed = 115200

[env:esp32dev_two_robot_bench_02]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DAGV_TWO_ROBOT_BENCH_TRIAL=1 -DAGV_ROBOT_PROFILE_02=1
upload_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32dev_two_robot_motor_probe_01]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DAGV_TWO_ROBOT_BENCH_TRIAL=1 -DAGV_BENCH_MOTOR_PROBE=1
upload_speed = 115200

[env:native]
platform = native @ 1.2.1
test_framework = unity
test_build_src = yes
build_flags = -std=c++17 -Isrc
build_src_filter = +<core/ControlLogic.cpp> +<core/CommandCodec.cpp> +<core/CoreProtocol.cpp> +<core/CoreNavigator.cpp>
lib_deps = bblanchon/ArduinoJson @ 6.21.5

[env:native_trial]
extends = env:native
build_flags = ${env:native.build_flags} -DAGV_ONE_ROBOT_TRIAL=1
test_filter = test_core_protocol

[env:native_robot01_bench]
extends = env:native
build_flags = ${env:native.build_flags} -DAGV_TWO_ROBOT_BENCH_TRIAL=1 -DAGV_ROBOT_PROFILE_01=1
test_filter = test_core_protocol

[env:native_robot02_bench]
extends = env:native
build_flags = ${env:native.build_flags} -DAGV_TWO_ROBOT_BENCH_TRIAL=1 -DAGV_ROBOT_PROFILE_02=1
test_filter = test_core_protocol

[env:native_two_robot_bench]
extends = env:native
build_flags = ${env:native.build_flags} -DAGV_TWO_ROBOT_BENCH_TRIAL=1
test_filter = test_core_protocol
